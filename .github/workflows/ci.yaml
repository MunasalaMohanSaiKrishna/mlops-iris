name: CI Pipeline

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate data
        run: python src/validate.py

      - name: Tune model
        run: python src/tune.py

      - name: Train model
        run: python src/train.py

      - name: Run tests
        run: pytest tests/

      - name: Lint
        run: |
          ruff check .

